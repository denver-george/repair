<!DOCTYPE html>
<html lang="ru">

<meta charset="UTF-8">

<title>ClickMaster — Калькулятор ремонта</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: #f4f6f8; color: #1f2937; line-height: 1.5; padding-bottom: 20px; }
  header { background: #1e293b; color: #fff; padding: 24px 16px; text-align: center; }
  .logo-icon { display: inline-flex; align-items: center; justify-content: center;
               width: 52px; height: 52px; background: #3b82f6; border-radius: 14px;
               margin-right: 12px; vertical-align: middle; font-size: 28px; }
  header h1 { font-size: 1.6rem; font-weight: 700; display: inline-block; vertical-align: middle; letter-spacing: 1px; }
  header .slogan { font-size: 0.95rem; opacity: 0.8; margin-top: 10px; }
  header .slogan span { display: inline-block; margin: 0 8px; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid;
          grid-template-columns: 1fr 380px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .section { background: #fff; border-radius: 10px; margin-bottom: 10px;
             box-shadow: 0 1px 3px rgba(0,0,0,.08); overflow: hidden; }
  .section-head { display: flex; justify-content: space-between; align-items: center;
                  padding: 14px 16px; cursor: pointer; font-weight: 600; user-select: none; }
  .section-head:hover { background: #f9fafb; }
  .section-head .arrow { transition: transform .2s; }
  .section.open .arrow { transform: rotate(90deg); }
  .section-body { display: none; padding: 0 16px 12px; }
  .section.open .section-body { display: block; }
  .item { display: flex; justify-content: space-between; align-items: center;
          padding: 8px 0; border-bottom: 1px dashed #e5e7eb; gap: 10px; flex-wrap: wrap; }
  .item:last-child { border-bottom: none; }
  .item label { display: flex; align-items: center; gap: 10px; cursor: pointer; flex: 1; min-width: 180px; }
  .item input[type=checkbox] { width: 18px; height: 18px; accent-color: #2563eb; flex-shrink: 0; }
  .item .unit { color: #6b7280; font-size: .82rem; }
  .qty { width: 72px; padding: 4px 6px; border: 1px solid #d1d5db; border-radius: 6px; font-size: .9rem; }
  .qty:disabled { background: #f3f4f6; color: #9ca3af; }
  .price { font-weight: 600; white-space: nowrap; color: #2563eb; min-width: 90px; text-align: right; }
  .cart { position: sticky; top: 16px; background: #fff; border-radius: 10px;
          padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
  .cart h2 { font-size: 1.1rem; margin-bottom: 10px; }
  .cart-list { max-height: 340px; overflow-y: auto; margin-bottom: 10px; }
  .cart-item { display: flex; justify-content: space-between; font-size: .82rem;
               padding: 5px 0; border-bottom: 1px solid #f1f5f9; gap: 8px; }
  .cart-item span:last-child { font-weight: 600; white-space: nowrap; }
  .cart-empty { color: #9ca3af; font-size: .9rem; }
  .cart-total { display: flex; justify-content: space-between; align-items: center;
                border-top: 2px solid #1f2937; padding-top: 10px; margin-top: 6px;
                font-size: 1.15rem; font-weight: 700; }
  .cart-total .sum { color: #2563eb; }
  .btn { width: 100%; background: #2563eb; color: #fff; border: none;
         padding: 12px; border-radius: 8px; font-size: 1rem; font-weight: 600;
         cursor: pointer; margin-top: 8px; }
  .btn:hover { background: #1d4ed8; }
  .btn-pdf { background: #10b981; }
  .btn-pdf:hover { background: #059669; }
  @media (max-width: 900px) {
    body { padding-bottom: 110px; }
    .cart { position: fixed; left: 0; right: 0; bottom: 0; top: auto;
            border-radius: 16px 16px 0 0; max-height: 70vh; overflow-y: auto;
            z-index: 50; transition: max-height 0.3s; padding: 12px 16px; }
    .cart.collapsed { max-height: 88px; overflow: hidden; }
    .cart.collapsed .cart-list,
    .cart.collapsed .btn-pdf,
    .cart.collapsed .note { display: none; }
    .cart-header { display: flex; justify-content: space-between; align-items: center;
                   cursor: pointer; margin-bottom: 8px; }
    .cart-header h2 { margin: 0; font-size: 1rem; }
    .cart-header .toggle-icon { font-size: 1.2rem; transition: transform 0.3s; }
    .cart.collapsed .cart-header .toggle-icon { transform: rotate(180deg); }
    .cart-total { border-top: none; padding-top: 0; margin-top: 0; font-size: 1rem; }
    .cart-total .sum { font-size: 1.1rem; }
    .btn { padding: 10px; margin-top: 6px; font-size: 0.95rem; }
  }
  .modal-overlay { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
                   background: rgba(0,0,0,0.5); z-index: 100; align-items: center; justify-content: center; }
  .modal-overlay.active { display: flex; }
  .modal { background: #fff; border-radius: 12px; padding: 24px; max-width: 400px;
           width: 90%; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
  .modal h3 { margin-bottom: 16px; }
  .modal label { display: block; margin-bottom: 4px; font-size: 0.9rem; font-weight: 500; }
  .modal input { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; margin-bottom: 12px; }
  .modal .modal-actions { display: flex; gap: 10px; margin-top: 8px; }
  .modal .modal-actions button { flex: 1; }
  .modal .btn-cancel { background: #e5e7eb; color: #1f2937; }
  .modal .btn-cancel:hover { background: #d1d5db; }
  .status-msg { font-size: 0.85rem; margin-top: 8px; text-align: center; }

<header>
  <div>
    <span class="logo-icon">🛠️</span>
    <h1>ClickMaster</h1>
  </div>
  <div class="slogan">
    <span>Ремонт под ключ — прозрачно и точно</span>
    <span>•</span>

  </div>
</header>

<div class="wrap">
  <main id="catalog"></main>
  <aside class="cart collapsed" id="cartPanel">
    <div class="cart-header" onclick="toggleCart()">
      <h2>Ваша смета</h2>
      <span class="toggle-icon">▲</span>
    </div>
    <div class="cart-list" id="cartList"><div class="cart-empty">Пока ничего не выбрано</div></div>
    <div class="cart-total"><span>Итого:</span><span class="sum" id="totalSum">0 ₽</span></div>
    <button class="btn" onclick="openRequestModal()">Оставить заявку</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">Скачать PDF</button>
    <div class="note">Предварительная стоимость. Точная — после замера.</div>
  </aside>
</div>

<div class="modal-overlay" id="requestModal">
  <div class="modal">
    <h3>Оставить заявку</h3>
    <p style="font-size:0.9rem; color:#6b7280; margin-bottom:16px;">Мы свяжемся с вами для уточнения деталей и точной сметы.</p>
    <form id="requestForm">
      <label for="clientName">Ваше имя</label>
      <input type="text" id="clientName" name="name" required placeholder="Иван">
      <label for="clientPhone">Телефон или Email</label>
      <input type="text" id="clientPhone" name="contact" required placeholder="+7 900 123-45-67">
      <div class="modal-actions">
        <button type="button" class="btn btn-cancel" onclick="closeRequestModal()">Отмена</button>
        <button type="submit" class="btn">Отправить</button>
      </div>
      <div class="status-msg" id="formStatus"></div>
    </form>
  </div>
</div>

/* ================= НАСТРОЙКИ ================= */
const FORMSPREE_ID = 'ВАШ_ID'; // <-- замените на свой ID из formspree.io

/* ================= РЕНДЕР ================= */
const catalog = document.getElementById("catalog");
DATA.forEach((section, si) => {
  const sec = document.createElement("div");
  sec.className = "section" + (si === 0 ? " open" : "");
  sec.innerHTML = `
    <div class="section-head"><span>${section.title}</span><span class="arrow">▶</span></div>
    <div class="section-body">
      ${section.items.map((it, ii) => `
        <div class="item">
          <label>
            <input type="checkbox" data-si="${si}" data-ii="${ii}">
            <span>${it[0]} <span class="unit">(${it[1]})</span></span>
          </label>
          <input type="number" class="qty" min="0" step="0.1" value="1" disabled data-si="${si}" data-ii="${ii}">
          <span class="price">${it[2].toLocaleString("ru-RU")} ₽<small>/${it[1]}</small></span>
        </div>`).join("")}
    </div>`;
  sec.querySelector(".section-head").addEventListener("click", () => sec.classList.toggle("open"));
  catalog.appendChild(sec);
});

/* ================= СМЕТА ================= */
const cartList = document.getElementById("cartList");
const totalSum = document.getElementById("totalSum");

function toggleCart() {
  if (window.innerWidth <= 900) {
    document.getElementById("cartPanel").classList.toggle("collapsed");
  }
}

function renderCart() {
  const chosen = [...document.querySelectorAll("input[type=checkbox]:checked")];
  cartList.innerHTML = "";
  let total = 0;
  if (chosen.length === 0) {
    cartList.innerHTML = '<div class="cart-empty">Пока ничего не выбрано</div>';
  } else {
    chosen.forEach(cb => {
      const si = +cb.dataset.si, ii = +cb.dataset.ii;
      const item = DATA[si].items[ii];
      const qtyInput = document.querySelector(`.qty[data-si="${si}"][data-ii="${ii}"]`);
      const qty = parseFloat(qtyInput.value) || 0;
      const sum = item[2] * qty;
      total += sum;
      const row = document.createElement("div");
      row.className = "cart-item";
      row.innerHTML = `<span>${item[0]}<br><small>${qty} ${item[1]} × ${item[2].toLocaleString("ru-RU")} ₽</small></span><span>${sum.toLocaleString("ru-RU")} ₽</span>`;
      cartList.appendChild(row);
    });
  }
  totalSum.textContent = total.toLocaleString("ru-RU") + " ₽";
  return { chosen, total };
}

document.addEventListener("change", e => {
  if (e.target.matches("input[type=checkbox]")) {
    const si = e.target.dataset.si, ii = e.target.dataset.ii;
    const qty = document.querySelector(`.qty[data-si="${si}"][data-ii="${ii}"]`);
    qty.disabled = !e.target.checked;
    renderCart();
  }
  if (e.target.matches(".qty")) renderCart();
});
document.addEventListener("input", e => { if (e.target.matches(".qty")) renderCart(); });

/* ================= PDF (через печать HTML — кириллица работает) ================= */
function downloadPDF() {
  const { chosen, total } = renderCart();
  if (chosen.length === 0) { alert("Выберите хотя бы одну работу."); return; }

  let rows = "";
  chosen.forEach(cb => {
    const si = +cb.dataset.si, ii = +cb.dataset.ii;
    const item = DATA[si].items[ii];
    const qty = parseFloat(document.querySelector(`.qty[data-si="${si}"][data-ii="${ii}"]`).value) || 0;
    rows += `<tr>
      <td>${item[0]}</td>
      <td>${qty} ${item[1]}</td>
      <td>${item[2].toLocaleString("ru-RU")} ₽</td>
      <td>${(item[2]*qty).toLocaleString("ru-RU")} ₽</td>
    </tr>`;
  });

  const html = `
    <html><head><meta charset="UTF-8">
    <title>Смета ClickMaster</title>
    <style>
      body { font-family: Arial, sans-serif; padding: 30px; color: #1f2937; }
      h1 { font-size: 22px; margin-bottom: 4px; }
      .sub { color: #6b7280; font-size: 13px; margin-bottom: 20px; }
      table { width: 100%; border-collapse: collapse; font-size: 13px; }
      th, td { border: 1px solid #d1d5db; padding: 8px; text-align: left; }
      th { background: #2563eb; color: #fff; }
      .total { margin-top: 20px; font-size: 18px; font-weight: bold; text-align: right; }
      .foot { margin-top: 30px; font-size: 11px; color: #9ca3af; }
    </style></head><body>
      <h1>ClickMaster — Смета на ремонт</h1>
      <div class="sub">Предварительная стоимость. Точная — после замера.</div>
      <table>
        <thead><tr><th>Работа</th><th>Объём</th><th>Цена за ед.</th><th>Сумма</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
      <div class="total">Итого: ${total.toLocaleString("ru-RU")} ₽</div>
      <div class="foot">Сформировано на сайте ClickMaster. Смета носит предварительный характер.</div>
    </body></html>`;

  const w = window.open("", "_blank");
  w.document.write(html);
  w.document.close();
  w.focus();
  setTimeout(() => { w.print(); }, 300);
}

/* ================= ЗАЯВКА ================= */
function openRequestModal() {
  const { chosen } = renderCart();
  if (chosen.length === 0) { alert("Сначала выберите хотя бы одну работу."); return; }
  document.getElementById("requestModal").classList.add("active");
  document.getElementById("formStatus").textContent = "";
}
function closeRequestModal() {
  document.getElementById("requestModal").classList.remove("active");
}
document.getElementById("requestForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const { chosen, total } = renderCart();
  const name = document.getElementById("clientName").value;
  const contact = document.getElementById("clientPhone").value;
  let worksText = "";
  chosen.forEach(cb => {
    const si = +cb.dataset.si, ii = +cb.dataset.ii;
    const item = DATA[si].items[ii];
    const qty = parseFloat(document.querySelector(`.qty[data-si="${si}"][data-ii="${ii}"]`).value) || 0;
    worksText += `${item[0]} — ${qty} ${item[1]} = ${(item[2]*qty).toLocaleString("ru-RU")} ₽\n`;
  });
  const statusEl = document.getElementById("formStatus");
  statusEl.textContent = "Отправка...";
  try {
    const res = await fetch(`https://formspree.io/f/${FORMSPREE_ID}`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name, contact, works: worksText, total: total.toLocaleString("ru-RU") + " ₽" })
    });
    if (res.ok) {
      statusEl.style.color = "green";
      statusEl.textContent = "Заявка отправлена! Мы свяжемся с вами.";
      setTimeout(() => { closeRequestModal(); }, 2000);
    } else {
      statusEl.style.color = "red";
      statusEl.textContent = "Ошибка отправки. Попробуйте позже.";
    }
  } catch (err) {
    statusEl.style.color = "red";
    statusEl.textContent = "Ошибка сети. Проверьте соединение.";
  }
});

renderCart();
